name: CI ubuntu-gcc

on:
  push:
    branches: [main, master, contour]
  pull_request:

jobs:
  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装工具链（GCC + Ninja）
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build
      - name: Configure
        run: cmake --preset linux-gcc-debug
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --preset linux-gcc-debug 2>&1 | tee test.log
      - name: 调试：失败时回传日志尾部（M9a 临时，无 token 环境下经 annotations 观察）
        if: failure()
        shell: bash
        run: |
          grep -E "FAIL |Failed|Timeout" test.log | head -6 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 6 test.log | while IFS= read -r l; do echo "::error::TAIL $l"; done
