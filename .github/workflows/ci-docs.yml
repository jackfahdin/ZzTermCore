name: CI docs

on:
  push:
    branches: [main, master, contour]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Doxygen 与 Graphviz（dot 供依赖图渲染，缺失在 WARN_AS_ERROR 下即失败）
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: 生成 API 文档（warning 即失败）
        shell: bash
        run: |
          set -o pipefail
          doxygen Doxyfile 2>&1 | tee doxy.log
      - name: 调试：失败时回传日志尾部（M9a 临时，无 token 环境下经 annotations 观察）
        if: failure()
        shell: bash
        run: tail -n 8 doxy.log | while IFS= read -r l; do echo "::error::$l"; done
